name: macOS

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Run unit tests
        run: swift test
      - name: Build Apple Silicon app bundle
        run: |
          chmod +x Scripts/build-app.sh
          Scripts/build-app.sh
      - name: Verify bundle architecture
        run: file dist/MacDict.app/Contents/MacOS/MacDict | grep arm64
      - name: Package app artifact
        run: ditto -c -k --sequesterRsrc --keepParent dist/MacDict.app dist/MacDict-arm64.zip
      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: MacDict-arm64
          path: dist/MacDict-arm64.zip
          if-no-files-found: error